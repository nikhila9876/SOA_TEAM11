server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-circuit-breaker
                fallbackUri: forward:/fallback

        - id: election-service
          uri: lb://election-service
          predicates:
            - Path=/api/elections/**
          filters:
            - name: CircuitBreaker
              args:
                name: election-circuit-breaker
                fallbackUri: forward:/fallback

        - id: voting-service
          uri: lb://voting-service
          predicates:
            - Path=/api/votes/**
          filters:
            - name: CircuitBreaker
              args:
                name: voting-circuit-breaker
                fallbackUri: forward:/fallback

        - id: result-service
          uri: lb://result-service
          predicates:
            - Path=/api/results/**
          filters:
            - name: CircuitBreaker
              args:
                name: result-circuit-breaker
                fallbackUri: forward:/fallback

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

jwt:
  secret: ${JWT_SECRET:mySecretKey256BitsLongForHS256AlgorithmRequirement}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    gateway:
      enabled: true
